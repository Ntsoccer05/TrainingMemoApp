  <!-- 構造化データ(WebApplication)。JS実行を待たずGooglebotの初回クロール時点で読めるよう、
       resources/js/utils/seoJsonLd.tsの内容をビルド時ではなく静的HTMLへ直接埋め込んでいる。
       内容を変更する場合はseoJsonLd.tsのbuildWebApplicationJsonLdと揃えること。 -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "トレメモ",
    "description": "トレメモは、あなたの日々のトレーニングを簡単に記録・管理できる無料サービスです。運動習慣をサポート！",

    "operatingSystem": "Web",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "JPY"
    }
  }
  </script>

  <link href="https://fonts.bunny.net/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Google tag (gtag.js) -->

    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    // SPAのためページ遷移はvue-router側(router/index.ts)でpage_viewを送信する。
    // ここでの自動送信を無効化しないと初回アクセス時にPVが二重計上される。
    gtag('config', 'G-KK04BK4PT8', { send_page_view: false });
  </script>
