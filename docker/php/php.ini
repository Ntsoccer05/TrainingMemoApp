[Date]
date.timezone = "Asia/Tokyo"
[mbstring]
# mbstring.internal_encoding = "UTF-8"  # php8以降非推奨
mbstring.language = "Japanese"
[PHP]
display_errors = On
memory_limit = 2048M
upload_max_filesize = 500M
post_max_size = 500M

;[xdebug]
;xdebug.mode = debug
;xdebug.start_with_request = yes
;xdebug.client_host = "host.docker.internal"
;xdebug.client_port = 9012
;xdebug.discover_client_host = 1
;xdebug.log = "/var/log/xdebug.log"

[opcache]
; vendor配下(バインドマウント経由で遅い)を事前コンパイルしてvalidate_timestampsの対象外にする。
; app配下は対象外なのでコード変更は引き続き毎リクエスト自動反映される。
; vendorを更新した場合はコンテナ再起動が必要(docker-compose restart app)。
opcache.preload = /var/www/html/preload.php
opcache.preload_user = www-data
; デフォルト128MBだとvendor配下800ファイル超のバイトコードを保持しきれないため引き上げる
opcache.memory_consumption = 256